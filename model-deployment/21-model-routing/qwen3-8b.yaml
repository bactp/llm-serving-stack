# Maps the OpenAI-style "model" field in the request body onto an llm-d
# InferencePool, so clients need nothing but base_url + api_key + model name.
#
# provider: Custom + custom.backendRef is the only shape that can target an
# InferencePool; the named providers (OpenAI, Bedrock, ...) all talk to a
# vendor endpoint instead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen3-8b
  namespace: llm-d-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
      # https listener ONLY. Bound to the Gateway as a whole, these model routes
      # also answer on :80 and they out-prioritise the catch-all redirect
      # HTTPRoute, so API keys would keep crossing the internet in cleartext.
      sectionName: https
  match:
    model: qwen3-8b
  provider: Custom
  custom:
    # vLLM's OpenAI-compatible server. `formats` is required and declares which
    # provider-native API shapes this backend speaks; enum is
    # Completions | Responses | Embeddings | Messages | Rerank | Realtime |
    # AnthropicTokenCount. Add Responses/Embeddings here if you start using them.
    formats:
      - type: Completions
    backendRef:
      group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen3-8b
  visibility: Public
---
# Second resource so the HuggingFace id keeps working as an alias. vLLM is
# started with --served-model-name "qwen3-8b" "Qwen/Qwen3-8B", so it answers to both.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen3-8b-hfid
  namespace: llm-d-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
      # https listener ONLY. Bound to the Gateway as a whole, these model routes
      # also answer on :80 and they out-prioritise the catch-all redirect
      # HTTPRoute, so API keys would keep crossing the internet in cleartext.
      sectionName: https
  match:
    model: Qwen/Qwen3-8B
  provider: Custom
  custom:
    # vLLM's OpenAI-compatible server. `formats` is required and declares which
    # provider-native API shapes this backend speaks; enum is
    # Completions | Responses | Embeddings | Messages | Rerank | Realtime |
    # AnthropicTokenCount. Add Responses/Embeddings here if you start using them.
    formats:
      - type: Completions
    backendRef:
      group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen3-8b
  visibility: Public
