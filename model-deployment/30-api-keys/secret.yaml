# Placeholder so `kubectl apply -k` can create the Secret before any key exists.
# bin/gen-api-key.sh merge-patches real entries into it; applying this file again
# does NOT wipe them (no `data`/`stringData` here means merge keeps existing keys).
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: llm-d-system
type: Opaque
