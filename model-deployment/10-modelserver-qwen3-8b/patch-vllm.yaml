apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  # 2 replicas is the point of this layout: the llm-d EPP's prefix-cache-affinity
  # and token-load scorers only have a decision to make when a pool has >1 endpoint.
  replicas: 2
  # Each replica pins a whole L4 and the two pools together saturate all 4 GPUs, so
  # the default 25% maxSurge (which rounds UP to 1) can never be satisfied: the surge
  # pod sits Pending on Insufficient nvidia.com/gpu and the rollout deadlocks forever.
  # Terminate-then-create is the only strategy that can make progress here; it costs
  # one replica of capacity mid-rollout, which the other replica absorbs.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: modelserver
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen3-8B"                 # resolved from the local HF cache, offline
            - "--served-model-name"
            - "qwen3-8b"                      # what clients send
            - "Qwen/Qwen3-8B"                 # accept the HF id too
            - "--tensor-parallel-size=1"      # 15.3 GiB bf16 weights fit one L4
            # KV budget after weights+overhead is ~3.0 GiB; fp8 KV halves the
            # per-token cost (144K -> 72K) giving ~44K tokens instead of ~22K.
            - "--kv-cache-dtype=fp8"
            - "--max-model-len=16384"
            - "--gpu-memory-utilization=0.90"
            - "--port=8000"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
          env:
            - name: HF_HOME
              value: /model-cache             # the EBS PV, weights already present
            - name: HF_HUB_OFFLINE
              value: "1"                      # never reach out to huggingface.co
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm              # torch.compile artifacts -> NVMe hostPath
            - name: TRITON_CACHE_DIR
              value: /cache/triton
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            requests:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "12"
              memory: 48Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: model-cache, mountPath: /model-cache }
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /v1/models, port: modelserver }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90              # 15 min budget for load + graph capture
          readinessProbe:
            httpGet: { path: /v1/models, port: modelserver }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: modelserver }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-pvc
        # torch.compile/inductor + triton artifacts. On instance-store NVMe on
        # purpose: it is a pure cache, so losing it to a stop/start costs only a
        # recompile, and keeping it off emptyDir is what makes that recompile stop
        # happening on every pod restart (qwen3-8b spent 35.6s there on a cold start).
        # Shared by both replicas by design - same model and config means the same
        # inductor cache key, so the second pod reuses what the first compiled.
        - name: cache
          hostPath:
            path: /opt/dlami/nvme/vllm-cache/qwen3-8b
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
